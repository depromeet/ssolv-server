name: CI

on:
  pull_request:
    branches: [ dev ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

jobs:
  analyze-changes:
    name: Analyze Changes
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.plan.outputs.changed_files }}
      changed_modules: ${{ steps.plan.outputs.changed_modules }}
      affected_modules: ${{ steps.plan.outputs.affected_modules }}
      test_tasks: ${{ steps.plan.outputs.test_tasks }}
      package_tasks: ${{ steps.plan.outputs.package_tasks }}
      image_tasks: ${{ steps.plan.outputs.image_tasks }}
      deploy_targets: ${{ steps.plan.outputs.deploy_targets }}
      terraform_targets: ${{ steps.plan.outputs.terraform_targets }}
      full_validation: ${{ steps.plan.outputs.full_validation }}
      has_app_changes: ${{ steps.plan.outputs.has_app_changes }}
      has_terraform_changes: ${{ steps.plan.outputs.has_terraform_changes }}
      has_test_tasks: ${{ steps.plan.outputs.has_test_tasks }}
      has_package_tasks: ${{ steps.plan.outputs.has_package_tasks }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve diff range
        id: diff
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "range=${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            previous="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
            echo "range=${previous}...HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Build selective CI plan
        id: plan
        run: scripts/selective-ci-plan.sh "${{ steps.diff.outputs.range }}"

      - name: Write plan summary
        run: |
          {
            echo "## Selective CI Plan"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Changed modules | \`${{ steps.plan.outputs.changed_modules || 'none' }}\` |"
            echo "| Affected modules | \`${{ steps.plan.outputs.affected_modules || 'none' }}\` |"
            echo "| Test tasks | \`${{ steps.plan.outputs.test_tasks || 'none' }}\` |"
            echo "| Package tasks | \`${{ steps.plan.outputs.package_tasks || 'none' }}\` |"
            echo "| Terraform targets | \`${{ steps.plan.outputs.terraform_targets || 'none' }}\` |"
            echo "| Deploy targets | \`${{ steps.plan.outputs.deploy_targets || 'none' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint (ktlint)
    runs-on: ubuntu-latest
    needs: analyze-changes
    if: needs.analyze-changes.outputs.has_app_changes == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx1g" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: ktlint Check
        run: ./gradlew ktlintCheck --continue

      - name: Upload ktlint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-report
          path: '**/build/reports/ktlint/'
          if-no-files-found: ignore

  selective-test:
    name: Selective Test
    runs-on: ubuntu-latest
    needs: analyze-changes
    if: needs.analyze-changes.outputs.has_test_tasks == 'true'

    environment:
      name: test

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set timezone
        run: sudo timedatectl set-timezone Asia/Seoul || echo "Asia/Seoul"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          echo "kotlin.incremental=false" >> ~/.gradle/gradle.properties

      - name: Run selected tests
        run: ./gradlew ${{ needs.analyze-changes.outputs.test_tasks }} --continue --stacktrace
        env:
          TZ: Asia/Seoul

      - name: Show test failures (if any)
        if: failure()
        run: |
          find . -name "TEST-*.xml" -exec echo "File: {}" \; -exec cat {} \; || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore

      - name: Upload Jacoco coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            **/build/reports/jacoco/test
            **/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: ignore

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/build/test-results/test/*.xml'
          check_name: '🧪 Test Results'
          comment_title: '🧪 테스트 결과'
          comment_mode: always
          report_individual_runs: true
          deduplicate_classes_by_file_name: false
          check_run_annotations: none

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: analyze-changes
    if: needs.analyze-changes.outputs.has_terraform_changes == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive deploy/terraform

      - name: Create targeted Terraform plans
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_ami_id: ${{ secrets.TF_AMI_ID }}
          TF_VAR_key_name: ${{ secrets.TF_KEY_NAME }}
          TF_VAR_public_key: ${{ secrets.TF_PUBLIC_KEY }}
          TF_VAR_db_password: ${{ secrets.PROD_DB_PASSWORD }}
          TF_VAR_restaurant_import_bucket_name: ${{ secrets.RESTAURANT_IMPORT_BUCKET_NAME }}
          TF_VAR_bucket_name: ${{ secrets.RESTAURANT_IMPORT_BUCKET_NAME }}
          TF_VAR_restaurant_batch_container_image: registry.ssolv.site/batch-worker:${{ github.event.pull_request.head.sha || github.sha }}
          TF_VAR_batch_container_image: registry.ssolv.site/batch-worker:${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/selective-terraform-plan.sh "${{ needs.analyze-changes.outputs.terraform_targets }}"

      - name: Encrypt saved Terraform plans
        env:
          TERRAFORM_PLAN_ENCRYPTION_KEY: ${{ secrets.TERRAFORM_PLAN_ENCRYPTION_KEY }}
        run: scripts/protect-terraform-plans.sh encrypt build/terraform-plans

      - name: Upload saved Terraform plans
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plans-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/terraform-plans/
          if-no-files-found: error
          retention-days: 1

      - name: Write Terraform summary
        if: always()
        run: |
          {
            echo "## Terraform Targets"
            echo
            echo "\`${{ needs.analyze-changes.outputs.terraform_targets }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  selective-build:
    name: Selective Build
    runs-on: ubuntu-latest
    needs: [ analyze-changes, selective-test ]
    if: always() && needs.analyze-changes.outputs.has_package_tasks == 'true' && needs.selective-test.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx2g" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Build selected packages
        run: ./gradlew ${{ needs.analyze-changes.outputs.package_tasks }} --stacktrace

  analysis:
    name: Analysis (SonarCloud)
    runs-on: ubuntu-latest
    needs: [ selective-test ]
    if: always() && needs.selective-test.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx2g" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          echo "sonar.gradle.skipCompile=true" >> ~/.gradle/gradle.properties

      - name: Download Jacoco coverage reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: jacoco-reports
          path: .

      - name: SonarCloud Analysis
        continue-on-error: true
        run: ./gradlew sonar -Dsonar.gradle.skipCompile=true --info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Seoul
