name: CI

on:
  pull_request:
    branches: [ dev ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  # ── Job 1: Lint (ktlint) ──────────────────────────────────────────
  # build-test 와 병렬 실행. 빠른 스타일 피드백 (~30초).
  lint:
    name: Lint (ktlint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx1g" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: ktlint Check
        run: ./gradlew ktlintCheck --continue

      - name: Upload ktlint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-report
          path: '**/build/reports/ktlint/'
          if-no-files-found: ignore

  # ── Job 2: Build & Test ───────────────────────────────────────────
  # lint 와 병렬 실행. Jacoco 아티팩트를 analysis job 에 전달.
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    environment:
      name: test

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set timezone
        run: sudo timedatectl set-timezone Asia/Seoul || echo "Asia/Seoul"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          echo "kotlin.incremental=false" >> ~/.gradle/gradle.properties

      - name: Build project (kapt 먼저 실행)
        run: ./gradlew build -x test --stacktrace
        env:
          TZ: Asia/Seoul

      - name: Run Tests and Generate Coverage Report
        run: ./gradlew test jacocoTestReport --continue --stacktrace
        env:
          TZ: Asia/Seoul

      - name: Show test failures (if any)
        if: failure()
        run: |
          find . -name "TEST-*.xml" -exec echo "File: {}" \; -exec cat {} \; || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'

      - name: Upload Jacoco coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            **/build/reports/jacoco/test
            **/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/build/test-results/test/*.xml'
          check_name: '🧪 Test Results'
          comment_title: '🧪 테스트 결과'
          comment_mode: always
          report_individual_runs: true
          deduplicate_classes_by_file_name: false
          check_run_annotations: none

  # ── Job 3: Analysis (SonarCloud) ─────────────────────────────────
  # build-test 완료 후 실행. Jacoco 아티팩트를 내려받아 커버리지 포함 분석.
  # 테스트 실패해도 코드 품질 분석은 실행 (needs.<job>.result 로 판단).
  analysis:
    name: Analysis (SonarCloud)
    runs-on: ubuntu-latest
    needs: [ build-test ]
    if: always() && needs.build-test.result != 'cancelled'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx2g" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          echo "sonar.gradle.skipCompile=true" >> ~/.gradle/gradle.properties

      - name: Download Jacoco coverage reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: jacoco-reports
          path: .

      - name: SonarCloud Analysis
        continue-on-error: true
        run: ./gradlew sonar -Dsonar.gradle.skipCompile=true --info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Seoul
