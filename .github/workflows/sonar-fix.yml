name: Sonar Auto-Fix Dispatch

# /sonar-fix run 코멘트 또는 workflow_dispatch 로 트리거.
# 이슈에서 체크된 group ID를 파싱해 Actions Summary에 로컬 실행 명령 한 줄을 출력한다.
#
# 로컬 실행 (이 워크플로가 출력하는 명령):
#   python3 .claude/scripts/sonar-fix-local.py --issue <issue_number>
#
# sonar-fix-local.py 가 각 그룹에 대해:
#   1. auto/sonar-fix/<id> 브랜치 생성 (origin/dev 기준)
#   2. claude -p "..." 로컬 실행 (Claude.ai 구독 사용 — API 크레딧 불필요)
#   3. git push + gh pr create 자동화

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Source issue number'
        required: true

permissions:
  contents: read
  issues: read

env:
  TRIGGER_PHRASE: '/sonar-fix run'

jobs:
  dispatch:
    name: Dispatch local fix
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
       contains(github.event.comment.body, '/sonar-fix run'))

    steps:
      - name: Authorize commenter
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
        run: |
          permission=$(gh api "/repos/$REPO/collaborators/$ACTOR/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          if [[ "$permission" != "admin" && "$permission" != "write" && "$permission" != "maintain" ]]; then
            echo "::warning::User $ACTOR (permission=$permission) is not authorized."
            exit 1
          fi

      - name: Resolve issue number
        id: issue
        env:
          EVENT: ${{ github.event_name }}
          COMMENT_ISSUE: ${{ github.event.issue.number }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue_number }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "number=$DISPATCH_ISSUE" >> "$GITHUB_OUTPUT"
          else
            echo "number=$COMMENT_ISSUE" >> "$GITHUB_OUTPUT"
          fi

      - name: Write run command to summary
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Sonar Fix 실행 명령

          아래 명령어 하나로 이슈 #${ISSUE_NUMBER}의 체크된 그룹을 모두 자동 처리합니다.

          \`\`\`bash
          python3 .claude/scripts/sonar-fix-local.py --issue ${ISSUE_NUMBER}
          \`\`\`

          각 그룹에 대해 브랜치 생성 → Claude 로컬 실행 → push → PR 생성이 자동으로 진행됩니다.
          EOF
