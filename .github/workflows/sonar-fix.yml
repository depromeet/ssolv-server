name: Sonar Auto-Fix Dispatch

# Sonar Auto-Fix Queue 이슈에서 `/sonar-fix run` 코멘트가 달리면, 체크된 그룹을
# 파싱해 그룹별 브랜치를 생성하고 이슈에 로컬 실행 가이드를 코멘트로 남긴다.
#
# 흐름:
#   1. 이슈에서 체크된 group ID 파싱
#   2. SonarCloud에서 그룹 메타 조회 (sonar-fetch.py)
#   3. 그룹별 auto/sonar-fix/<id> 브랜치 생성 & push
#   4. 이슈에 `claude -p "..."` 로컬 실행 가이드 코멘트
#
# 로컬 실행:
#   git fetch && git checkout auto/sonar-fix/<id>
#   claude -p "..." --allowedTools "..."
#   git push
#   gh pr create ...
#
# 활성화 조건:
#   - 코멘트 작성자가 repo write 권한 보유

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      group_ids:
        description: 'Comma-separated group IDs (e.g. auto_safe-kotlin_S6518-ssolv-api-common)'
        required: true
      issue_number:
        description: 'Source issue number for status reporting'
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  ISSUE_LABEL: sonar-auto-fix-queue
  TRIGGER_PHRASE: '/sonar-fix run'

jobs:
  # ── Job 1: Parse approval & extract group IDs ─────────────────────
  parse:
    name: Parse approval
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
       contains(github.event.comment.body, '/sonar-fix run'))
    outputs:
      group_ids: ${{ steps.extract.outputs.group_ids }}
      issue_number: ${{ steps.extract.outputs.issue_number }}
      authorized: ${{ steps.authz.outputs.authorized || steps.authz_dispatch.outputs.authorized }}

    steps:
      - name: Authorize commenter
        id: authz
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
        run: |
          permission=$(gh api "/repos/$REPO/collaborators/$ACTOR/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          if [[ "$permission" == "admin" || "$permission" == "write" || "$permission" == "maintain" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "::warning::User $ACTOR (permission=$permission) is not authorized."
          fi

      - name: Authorize dispatch
        id: authz_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: echo "authorized=true" >> "$GITHUB_OUTPUT"

      - name: Checkout (for issue body parsing)
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4

      - name: Extract checked group IDs
        id: extract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_IDS: ${{ github.event.inputs.group_ids }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue_number }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "group_ids=$DISPATCH_IDS" >> "$GITHUB_OUTPUT"
            echo "issue_number=$DISPATCH_ISSUE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body=$(gh issue view "$ISSUE_NUMBER" --json body --jq '.body')
          ids=$(echo "$body" | grep -E '^- \[[xX]\]' \
            | grep -oE '`[a-z_]+-[a-zA-Z0-9_]+-ssolv-[a-z-]+`' \
            | tr -d '`' \
            | sort -u \
            | tr '\n' ',' | sed 's/,$//')
          echo "Detected group IDs: $ids"
          echo "group_ids=$ids" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

  # ── Job 2: Build fix matrix ───────────────────────────────────────
  build-matrix:
    name: Build fix matrix
    needs: parse
    if: needs.parse.outputs.authorized == 'true' && needs.parse.outputs.group_ids != ''
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build matrix
        id: build
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GROUP_IDS: ${{ needs.parse.outputs.group_ids }}
        run: |
          python3 .claude/scripts/sonar-fetch.py --output json > sonar.json
          python3 - "$GROUP_IDS" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          ids = set(s.strip() for s in sys.argv[1].split(',') if s.strip())
          with open('sonar.json') as f: data = json.load(f)
          selected = [g for g in data['groups'] if g['id'] in ids]
          matrix = {'include': selected}
          print(f"matrix={json.dumps(matrix)}")
          PY

  # ── Job 3: Create branches & post local run guide ─────────────────
  prepare:
    name: Create branches & guide
    needs: [parse, build-matrix]
    if: needs.build-matrix.outputs.matrix != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Create branches & post instructions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_JSON: ${{ needs.build-matrix.outputs.matrix }}
          ISSUE_NUMBER: ${{ needs.parse.outputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/prepare.py << 'PYEOF'
          import json, os, re, subprocess, sys

          matrix = json.loads(os.environ['MATRIX_JSON'])
          groups = matrix['include']
          issue_number = os.environ.get('ISSUE_NUMBER', '')
          repo = os.environ['REPO']
          allowed = 'Edit,MultiEdit,Glob,Grep,LS,Read,Write,Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(./gradlew:*)'

          blocks = []
          for g in groups:
              gid       = g['id']
              rule      = g['rule']
              module    = g['module']
              reason    = g.get('reason', '')
              files     = g.get('files', [])
              classif   = g.get('classification', 'auto_with_review')
              count     = g.get('count', len(files))

              branch = re.sub(r'[^a-zA-Z0-9/_-]', '-', f'auto/sonar-fix/{gid}')

              r = subprocess.run(['git', 'checkout', '-b', branch],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  print(f'[warn] {branch}: {r.stderr.strip()}', file=sys.stderr)
              subprocess.run(['git', 'push', '-u', 'origin', branch], check=True)
              subprocess.run(['git', 'checkout', 'dev'], check=True)

              labels = 'sonar-auto-fix,' + ('auto-merge' if classif == 'auto_safe' else 'review-required')
              files_md = '\n'.join(f'  - `{f}`' for f in files)
              prompt = (
                  f'Fix SonarCloud rule {rule} in module {module}. '
                  f'{reason}. '
                  f'Only modify: {chr(34)}{", ".join(files)}{chr(34)}. '
                  f'Run ./gradlew :{module}:ktlintFormat :{module}:test before committing. '
                  f'Commit message: refactor(sonar): fix {rule} in {module}.'
              )
              pr_cmd = (
                  f'gh pr create --repo {repo} --base dev --head {branch} '
                  f'--title "refactor(sonar): fix {rule} in {module}" '
                  f'--label "{labels}"'
              )

              block = (
                  f'\n### `{gid}` — `{rule}` × `{module}` ({count}건)\n\n'
                  f'파일:\n{files_md}\n\n'
                  f'```bash\n'
                  f'git fetch && git checkout {branch}\n'
                  f'claude -p "{prompt}" --allowedTools "{allowed}"\n'
                  f'git push\n'
                  f'{pr_cmd}\n'
                  f'```'
              )
              blocks.append(block)

          body = '🔧 Fix 브랜치 생성 완료. 로컬에서 각 그룹 순서대로 실행하세요:\n\n' + '\n\n---\n'.join(blocks)

          if issue_number:
              result = subprocess.run(
                  ['gh', 'issue', 'comment', issue_number, '--repo', repo, '--body', body],
                  capture_output=True, text=True
              )
              if result.returncode != 0:
                  print(result.stderr, file=sys.stderr)
                  sys.exit(1)
          else:
              print(body)
          PYEOF
          python3 /tmp/prepare.py
