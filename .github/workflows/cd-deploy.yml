name: CD Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Push with Jib
        run: |
          ./gradlew :ssolv-api-core:jib \
            -Djib.to.auth.username=${{ secrets.REGISTRY_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.REGISTRY_PASSWORD }} \
            -Djava.net.preferIPv4Stack=true

  # Instance A 먼저 배포 — Route53 헬스체크가 A를 unhealthy로 감지하는 동안 B가 트래픽 처리
  deploy-instance-a:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: deploy-to-ssolv-prod-server
      url: https://api.ssolv.site
    steps:
      - name: Deploy to Instance A
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: FIREBASE_SERVICE_ACCOUNT,REGISTRY_USERNAME,REGISTRY_PASSWORD
          script: |
            set -e

            cd ~/17th-team3-Server

            git fetch origin
            git reset --hard origin/main

            echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json
            chmod 600 firebase-service-account.json

            echo "$REGISTRY_PASSWORD" | docker login registry.ssolv.site -u "$REGISTRY_USERNAME" --password-stdin
            docker pull registry.ssolv.site/api-server:latest

            docker compose -f deploy/docker-compose.instance-a.yml up -d --no-deps --force-recreate app-server

            echo "Waiting for app-server to be healthy (max 3.5 min)..."
            for i in $(seq 1 21); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' app-server 2>/dev/null || echo "missing")
              if [ "$STATUS" = "healthy" ]; then
                echo "Instance A healthy after ${i}0s"
                break
              fi
              echo "  [$i/21] status=$STATUS, retrying in 10s..."
              sleep 10
            done

            STATUS=$(docker inspect --format='{{.State.Health.Status}}' app-server 2>/dev/null || echo "missing")
            if [ "$STATUS" != "healthy" ]; then
              echo "Instance A deployment failed (status=$STATUS)"
              docker logs app-server --tail 80
              exit 1
            fi

            docker image prune -f
            echo "Instance A deployment complete"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  # A가 healthy 확인된 후 B 배포 — 롤링 업데이트로 무중단 배포
  deploy-instance-b:
    needs: deploy-instance-a
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Instance B
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_B }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: FIREBASE_SERVICE_ACCOUNT,REGISTRY_USERNAME,REGISTRY_PASSWORD
          script: |
            set -e

            cd ~/17th-team3-Server

            git fetch origin
            git reset --hard origin/main

            echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json
            chmod 600 firebase-service-account.json

            echo "$REGISTRY_PASSWORD" | docker login registry.ssolv.site -u "$REGISTRY_USERNAME" --password-stdin
            docker pull registry.ssolv.site/api-server:latest

            docker compose -f deploy/docker-compose.instance-b.yml up -d --no-deps --force-recreate app-server

            echo "Waiting for app-server to be healthy (max 3.5 min)..."
            for i in $(seq 1 21); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' app-server 2>/dev/null || echo "missing")
              if [ "$STATUS" = "healthy" ]; then
                echo "Instance B healthy after ${i}0s"
                break
              fi
              echo "  [$i/21] status=$STATUS, retrying in 10s..."
              sleep 10
            done

            STATUS=$(docker inspect --format='{{.State.Health.Status}}' app-server 2>/dev/null || echo "missing")
            if [ "$STATUS" != "healthy" ]; then
              echo "Instance B deployment failed (status=$STATUS)"
              docker logs app-server --tail 80
              exit 1
            fi

            docker image prune -f
            echo "Instance B deployment complete"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
