name: Sonar Auto-Fix Queue (Issue)

# 매일 00:00 KST (= 전날 15:00 UTC) 또는 수동 트리거 시 SonarCloud 결과를
# 그룹화하여 GitHub Issue 체크리스트로 갱신한다.

on:
  schedule:
    - cron: '0 15 * * *'   # 15:00 UTC = 00:00 KST (다음날)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sonar-auto-fix-queue
  cancel-in-progress: false

env:
  ISSUE_LABEL: sonar-auto-fix-queue
  ISSUE_TITLE: '[Sonar] Auto-Fix Queue'

jobs:
  upsert-issue:
    name: Upsert Sonar Issue
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate issue body
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 .claude/scripts/sonar-fetch.py --output markdown > issue-body.md
          echo "----- preview -----"
          head -20 issue-body.md
          echo "----- (truncated) -----"

      - name: Ensure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh label list --limit 200 | grep -q "^${ISSUE_LABEL}\b"; then
            gh label create "$ISSUE_LABEL" \
              --description "Sonar auto-fix queue (managed by sonar-issue.yml)" \
              --color BFD4F2
          fi

      - name: Find existing open issue
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list \
            --label "$ISSUE_LABEL" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Update or create issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXISTING: ${{ steps.find.outputs.number }}
        run: |
          if [ -n "$EXISTING" ]; then
            issue_number="$EXISTING"
            gh issue edit "$issue_number" --body-file issue-body.md
          else
            issue_number=$(gh issue create \
              --title "$ISSUE_TITLE" \
              --body-file issue-body.md \
              --label "$ISSUE_LABEL" \
              --json number --jq '.number')
            echo "Created issue #$issue_number"
          fi

          # 이슈 번호를 알게 된 시점에 실행 명령어를 본문 상단에 추가
          {
            echo '## 실행 방법'
            echo ''
            echo '체크할 항목 선택 후 아래 명령어를 로컬에서 실행하세요.'
            echo ''
            echo '```bash'
            echo "python3 .claude/scripts/sonar-fix-local.py --issue ${issue_number}"
            echo '```'
            echo ''
            echo '---'
            echo ''
            cat issue-body.md
          } > issue-body-final.md
          gh issue edit "$issue_number" --body-file issue-body-final.md
