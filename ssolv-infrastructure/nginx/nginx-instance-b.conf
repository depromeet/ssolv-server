worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=30s ipv6=off;

    sendfile        on;
    keepalive_timeout 65;

    log_format main '$request_id $remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$request_time" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '"$ssl_protocol/$ssl_cipher" "$content_length" "$request_length"';

    upstream app-server {
        server app-server:8080;
    }

    upstream docker_registry {
        server registry:5000;
    }

    # stub_status (모니터링 내부 전용)
    server {
        listen 80;
        server_name localhost;

        location /stub_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }
    }

    # HTTP → HTTPS 리다이렉트 (api + registry 공통)
    server {
        listen 80 default_server;
        server_name api.ssolv.site registry.ssolv.site;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── api.ssolv.site ───────────────────────────────────────────────────────

    server {
        listen 443 ssl;
        server_name api.ssolv.site;

        ssl_certificate     /etc/letsencrypt/live/api.ssolv.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.ssolv.site/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        absolute_redirect off;
        access_log /var/log/nginx/access.log main;

        location ~* \.(php|asp|aspx|jsp|cgi|env|git|yaml|yml)$ {
            access_log off;
            log_not_found off;
            return 444;
        }

        location ~* /(wp-admin|wp-login|wp-content|admin|phpmyadmin|console) {
            access_log off;
            log_not_found off;
            return 444;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-RequestID $request_id;
        proxy_pass_request_headers on;
        proxy_next_upstream http_502 http_503 http_504;

        set $cors_origin "";
        if ($http_origin ~* "^https?://(www\.ssolv\.site|localhost:3000)$") {
            set $cors_origin $http_origin;
        }
        add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        location / {
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_pass http://app-server;
        }
    }

    # ─── registry.ssolv.site ─────────────────────────────────────────────────

    server {
        listen 443 ssl;
        server_name registry.ssolv.site;

        ssl_certificate     /etc/letsencrypt/live/registry.ssolv.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/registry.ssolv.site/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Docker-Distribution-Api-Version "registry/2.0" always;

        location /v2/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_read_timeout 900;
            proxy_send_timeout 900;

            proxy_pass http://docker_registry/v2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_headers on;

            client_max_body_size 0;
            chunked_transfer_encoding on;
        }

        location / {
            default_type text/plain;
            return 200 'registry ok';
        }
    }
}
