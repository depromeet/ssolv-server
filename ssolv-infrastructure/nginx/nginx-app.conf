worker_processes auto;       

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Docker DNS resolver 설정
    resolver 127.0.0.11 valid=30s ipv6=off;

    sendfile on;
    keepalive_timeout 65;
    
    # 로그 포맷 정의 (request_id 포함)
    log_format main '$request_id $remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$request_time" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '"$ssl_protocol/$ssl_cipher" "$content_length" '
                    '"$request_length"';
    
    upstream app-server {
        # 장소 검색과 같은 고부하 요청을 고려하여 연결 수가 적은 서버에 우선 배분
        least_conn;
        server app-server-1:8080;
        server app-server-2:8080;
    }

    # 1. 메트릭 수집 및 기본 설정 (내부 호출용)
    server {
        listen 80;
        server_name localhost;
        
        # nginx-exporter용 stub_status
        location /stub_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker 네트워크
            deny all;
        }
    }

    # 2. WAS (API 서버)
    server {
        listen 80 default_server;
        server_name api.ssolv.site _;
        
        absolute_redirect off;

        # CloudFront 비밀 헤더 검증 (직접 접근 차단)
        # 단, 내부 네트워크(Docker)에서의 접근은 허용 (모니터링용)
        set $is_internal 0;
        if ($remote_addr ~ "^(127\.0\.0\.1|172\.(1[6-9]|2[0-9]|3[0-1])\..*)$") {
            set $is_internal 1;
        }

        if ($http_x_origin_verify != "ssolv-secret-2025") {
            set $check_internal "${is_internal}0";
        }
        if ($check_internal = "00") {
            return 403;
        }

        # nginx-exporter용 stub_status
        location /stub_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker 네트워크
            deny all;
        }

        # access_log 설정 (request_id 포함)
        access_log /var/log/nginx/access.log main;

        # 악성 봇 및 스캐너 차단
        location ~* \.(php|asp|aspx|jsp|cgi|env|git|yaml|yml)$ {
            access_log off;
            log_not_found off;
            return 444;
        }

        location ~* /(wp-admin|wp-login|wp-content|admin|phpmyadmin|console) {
            access_log off;
            log_not_found off;
            return 444;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-RequestID $request_id;
        proxy_pass_request_headers on;
        
        proxy_next_upstream http_502 http_503 http_504;

        # CORS 설정 (공통)
        set $cors_origin "";
        if ($http_origin ~* "^https?://(www\.ssolv\.site|localhost:3000)$") {
            set $cors_origin $http_origin;
        }

        add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # 통합 API 라우팅
        location / {
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_pass http://app-server;
        }
    }
}