services:
  nginx-cicd:
    container_name: nginx-cicd
    image: nginx:1.29.0
    ports:
      - "443:443"
      - "900:80" # 기존 관리 페이지용 유지 (필요 시)
    volumes:
      - ./ssolv-infrastructure/nginx/nginx-cicd.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./ssolv-infrastructure/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    environment:
      - TZ=Asia/Seoul
    networks:
      - ssolv_cicd_network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      - registry
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/stub_status" ]
      interval: 30s
      timeout: 10s
      retries: 3

  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Registry Realm"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_CATALOG_MAXENTRIES: 5000
      REGISTRY_HTTP_SECRET: "a-very-long-random-string-for-http-secret"
      REGISTRY_HTTP_TIMEOUT_READ: "300s"
      REGISTRY_HTTP_TIMEOUT_WRITE: "300s"
      REGISTRY_HTTP_TIMEOUT_IDLE: "900s"
      # 스토리지 설정 (업로드 청크 크기 최적화)
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_STORAGE_CACHE_BLOBDESCRIPTOR: "inmemory"
      REGISTRY_LOG_LEVEL: "info"
    volumes:
      - registry_data:/var/lib/registry
      - ./ssolv-infrastructure/nginx/.htpasswd:/auth/htpasswd:ro
    networks:
      - ssolv_cicd_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "7"

volumes:
  registry_data:
    driver: local

networks:
  ssolv_cicd_network:
    driver: bridge
