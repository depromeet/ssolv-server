# 인스턴스 A (t3.micro) — nginx + app-server
# INSTANCE_B_PRIVATE_IP 환경변수 필수 (terraform output instance_b_private_ip)
#
# 시작 순서:
#   1. 먼저 certbot으로 api.ssolv.site 인증서 발급 (아래 주석 참조)
#   2. docker network create ssolv_prod_network
#   3. docker compose -f docker-compose.instance-a.yml up -d

services:
  app-server:
    container_name: app-server
    image: ${DOCKER_IMAGE_API:-registry.ssolv.site/api-server:latest}
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_USER=${PROD_DB_USERNAME}
      - MYSQL_PASSWORD=${PROD_DB_PASSWORD}
      - MYSQL_URL=jdbc:mysql://${PROD_DB_ENDPOINT}:3306/${PROD_DB_NAME}
      - REDIS_HOST=${INSTANCE_B_PRIVATE_IP}
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx400m
      - OTLP_ENDPOINT=http://${INSTANCE_B_PRIVATE_IP}:4318/v1/traces
    volumes:
      - ./firebase-service-account.json:/home/ubuntu/17th-team3-Server/firebase-service-account.json:ro
    networks:
      - ssolv_prod_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "7"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 512m
    mem_reservation: 256m

  nginx:
    container_name: nginx
    image: nginx:1.29.0
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssolv-infrastructure/nginx/nginx-app-instance-a.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - TZ=Asia/Seoul
    networks:
      - ssolv_prod_network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      app-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/stub_status" ]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 128m
    mem_reservation: 32m

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    restart: unless-stopped
    ports:
      - "9113:9113"
    command:
      - '--nginx.scrape-uri=http://nginx:80/stub_status'
    networks:
      - ssolv_prod_network
    depends_on:
      nginx:
        condition: service_healthy

networks:
  ssolv_prod_network:
    external: true
