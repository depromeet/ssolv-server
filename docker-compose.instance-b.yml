# 인스턴스 B (t3.small) — app-server + redis + registry + nginx-cicd + monitoring
#
# 시작 순서:
#   1. 먼저 certbot으로 registry.ssolv.site 인증서 발급 (아래 주석 참조)
#   2. docker network create ssolv_prod_network
#   3. docker network create ssolv_cicd_network
#   4. docker network create ssolv_monitoring_network
#   5. docker compose -f docker-compose.instance-b.yml up -d

services:
  app-server:
    container_name: app-server
    image: ${DOCKER_IMAGE_API:-registry.ssolv.site/api-server:latest}
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_USER=${PROD_DB_USERNAME}
      - MYSQL_PASSWORD=${PROD_DB_PASSWORD}
      - MYSQL_URL=jdbc:mysql://${PROD_DB_ENDPOINT}:3306/${PROD_DB_NAME}
      - REDIS_HOST=redis
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx400m
      - OTLP_ENDPOINT=http://alloy:4318/v1/traces
    volumes:
      - ./firebase-service-account.json:/home/ubuntu/17th-team3-Server/firebase-service-account.json:ro
    networks:
      - ssolv_prod_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "7"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 512m
    mem_reservation: 256m

  redis:
    container_name: redis
    image: redis:7-alpine
    command: redis-server --maxmemory 150mb --maxmemory-policy allkeys-lru --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    networks:
      - ssolv_prod_network
    restart: always
    mem_limit: 200m
    mem_reservation: 64m

  # ─── CI/CD 인프라 ─────────────────────────────────────────────────────────

  nginx:
    container_name: nginx
    image: nginx:1.29.0
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssolv-infrastructure/nginx/nginx-instance-b.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - TZ=Asia/Seoul
    networks:
      - ssolv_prod_network
      - ssolv_cicd_network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      app-server:
        condition: service_healthy
      registry:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/stub_status"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 128m
    mem_reservation: 32m

  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Registry Realm"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_CATALOG_MAXENTRIES: 5000
      REGISTRY_HTTP_SECRET: "a-very-long-random-string-for-http-secret"
      REGISTRY_HTTP_TIMEOUT_READ: "300s"
      REGISTRY_HTTP_TIMEOUT_WRITE: "300s"
      REGISTRY_HTTP_TIMEOUT_IDLE: "900s"
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_STORAGE_CACHE_BLOBDESCRIPTOR: "inmemory"
      REGISTRY_LOG_LEVEL: "info"
    volumes:
      - registry_data:/var/lib/registry
      - ./ssolv-infrastructure/nginx/.htpasswd:/auth/htpasswd:ro
    networks:
      - ssolv_cicd_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "7"

  # ─── 모니터링 ─────────────────────────────────────────────────────────────

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    user: root
    restart: unless-stopped
    volumes:
      - ./ssolv-infrastructure/monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    env_file:
      - .env
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - ssolv_prod_network
      - ssolv_monitoring_network
    mem_limit: 256m
    mem_reservation: 128m

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - ssolv_monitoring_network

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    restart: unless-stopped
    command:
      - '--nginx.scrape-uri=http://nginx-cicd:80/stub_status'
    networks:
      - ssolv_cicd_network
      - ssolv_monitoring_network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
    networks:
      - ssolv_prod_network
      - ssolv_monitoring_network

volumes:
  registry_data:
    driver: local

networks:
  ssolv_prod_network:
    external: true
  ssolv_cicd_network:
    driver: bridge
  ssolv_monitoring_network:
    driver: bridge
