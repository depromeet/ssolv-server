server:
  port: 8080
  forward-headers-strategy: native

spring:
  config:
    activate:
      on-profile: prod
  
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}


management:
  tracing:
    sampling:
      probability: 1.0

app:
  env: prod

kakao:
  redirect-uris:
    - http://localhost:3000/auth/callback
    - http://localhost:8080/auth/callback
    - https://www.ssolv.site/auth/callback
    - https://api.ssolv.site/auth/callback
    - https://ec01-58-29-179-24.ngrok-free.app/auth/callback

api:
  google:
    places:
      api-key: ${GOOGLE_PLACES_API_KEY}
      base-url: https://places.googleapis.com

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:file:/home/ubuntu/17th-team3-Server/firebase-service-account.json}

demo:
  email: ${DEMO_EMAIL:ssolvofficial@gmail.com}
  password: ${DEMO_PASSWORD}

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.5
  exception-resolver-order: 1
  logging:
    mdc-tags: request_id,user_id,meeting_id,fcm_token