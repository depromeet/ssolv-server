# datasource 설정은 TestContainerConfig가 동적으로 주입 (yml에 선언 불필요)
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

api:
  google:
    places:
      api-key: test-api-key
      base-url: http://localhost

logging:
  level:
    org.depromeet.team3: DEBUG
    org.springframework.data.redis: INFO
