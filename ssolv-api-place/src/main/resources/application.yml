server:
  port: 8081

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: ssolv-api-place
  
  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:mysql://localhost:3306/${DEFAULT_SCHEMA}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

# 앱 설정
app:
  env: local


api:
  google:
    places:
      api-key: ${GOOGLE_PLACES_API_KEY}
      base-url: https://places.googleapis.com
      request-semaphore-size: ${GOOGLE_PLACES_REQUEST_SEMAPHORE_SIZE:4}
      rate-limit:
        enabled: ${GOOGLE_PLACES_RATE_LIMIT_ENABLED:true}
        bucket-key: ${GOOGLE_PLACES_RATE_LIMIT_BUCKET_KEY:google:places:token-bucket}
        refill-rate-per-second: ${GOOGLE_PLACES_RATE_LIMIT_REFILL_RATE:15}
        bucket-capacity: ${GOOGLE_PLACES_RATE_LIMIT_BUCKET_CAPACITY:30}
        token-acquire-timeout-ms: ${GOOGLE_PLACES_RATE_LIMIT_ACQUIRE_TIMEOUT_MS:800}
        retry-delay-ms: ${GOOGLE_PLACES_RATE_LIMIT_RETRY_DELAY_MS:50}
        bucket-ttl-seconds: ${GOOGLE_PLACES_RATE_LIMIT_BUCKET_TTL_SECONDS:120}
        adaptive:
          enabled: ${GOOGLE_PLACES_RATE_LIMIT_ADAPTIVE_ENABLED:true}
          min-rate-per-second: ${GOOGLE_PLACES_RATE_LIMIT_MIN_RATE:5}
          max-rate-per-second: ${GOOGLE_PLACES_RATE_LIMIT_MAX_RATE:20}
          evaluation-interval-ms: ${GOOGLE_PLACES_RATE_LIMIT_EVALUATION_INTERVAL_MS:30000}
          timeout-ratio-threshold: ${GOOGLE_PLACES_RATE_LIMIT_TIMEOUT_RATIO_THRESHOLD:0.05}
          decrease-on-429-ratio: ${GOOGLE_PLACES_RATE_LIMIT_DECREASE_ON_429_RATIO:0.5}
          decrease-on-timeout-ratio: ${GOOGLE_PLACES_RATE_LIMIT_DECREASE_ON_TIMEOUT_RATIO:0.7}
          increase-step: ${GOOGLE_PLACES_RATE_LIMIT_INCREASE_STEP:1}

# WAS 헬스 체크 및 모니터링 관련
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 0.1
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://alloy:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true
